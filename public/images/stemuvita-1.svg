<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D8F3DC"/>
      <stop offset="100%" style="stop-color:#B7E4C7"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E5B41"/>
      <stop offset="100%" style="stop-color:#1B4332"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- Bottle body -->
  <rect x="310" y="200" width="180" height="380" rx="30" fill="url(#bottle)"/>
  <!-- Bottle neck -->
  <rect x="345" y="155" width="110" height="60" rx="10" fill="#2E5B41"/>
  <!-- Cap -->
  <rect x="340" y="130" width="120" height="35" rx="8" fill="#98CBB0"/>
  <!-- Label -->
  <rect x="325" y="280" width="150" height="180" rx="8" fill="white" opacity="0.9"/>
  <!-- Label text -->
  <text x="400" y="330" font-family="Georgia, serif" font-size="14" fill="#142718" text-anchor="middle" font-weight="bold">Stemuvita™</text>
  <text x="400" y="355" font-family="Arial, sans-serif" font-size="10" fill="#2E5B41" text-anchor="middle">HAIR CLEANSE</text>
  <line x1="340" y1="370" x2="460" y2="370" stroke="#D8F3DC" stroke-width="1"/>
  <text x="400" y="395" font-family="Arial, sans-serif" font-size="9" fill="#52796F" text-anchor="middle">Plant-Based Formula</text>
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="9" fill="#52796F" text-anchor="middle">Sulfate-Free · 250ml</text>
  <!-- Leaf decoration -->
  <ellipse cx="400" cy="640" rx="60" ry="15" fill="#2E5B41" opacity="0.2"/>
</svg>
