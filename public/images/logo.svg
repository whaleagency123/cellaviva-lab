<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">

  <!-- Left Leaf -->
  <path d="M 91,25 C 84,11 64,7 70,22 C 74,32 90,31 91,25 Z" fill="#2B5E3F"/>
  <!-- Right Leaf -->
  <path d="M 109,25 C 116,11 136,7 130,22 C 126,32 110,31 109,25 Z" fill="#2B5E3F"/>
  <!-- Stems connecting leaves to helix -->
  <path d="M 91,24 Q 96,29 100,34" stroke="#2B5E3F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 109,24 Q 104,29 100,34" stroke="#2B5E3F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left DNA strand -->
  <path d="M 76,34 C 76,54 124,74 124,94 C 124,114 76,134 76,154"
        stroke="#2B5E3F" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right DNA strand -->
  <path d="M 124,34 C 124,54 76,74 76,94 C 76,114 124,134 124,154"
        stroke="#2B5E3F" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Horizontal rungs -->
  <line x1="76"  y1="34"  x2="124" y2="34"  stroke="#2B5E3F" stroke-width="3"   stroke-linecap="round"/>
  <line x1="81"  y1="53"  x2="119" y2="53"  stroke="#2B5E3F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76"  y1="94"  x2="124" y2="94"  stroke="#2B5E3F" stroke-width="3"   stroke-linecap="round"/>
  <line x1="81"  y1="135" x2="119" y2="135" stroke="#2B5E3F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76"  y1="154" x2="124" y2="154" stroke="#2B5E3F" stroke-width="3"   stroke-linecap="round"/>

  <!-- CELLAVIVA -->
  <text x="100" y="189"
        text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-weight="900"
        font-size="23"
        fill="#1B3E2A"
        letter-spacing="1.5">CELLAVIVA</text>

  <!-- LAB -->
  <text x="100" y="213"
        text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-weight="300"
        font-size="16"
        fill="#1B3E2A"
        letter-spacing="8">LAB</text>

</svg>
